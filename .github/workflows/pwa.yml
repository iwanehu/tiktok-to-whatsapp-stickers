name: PWA
on:
  pull_request:
    paths: ['pwa/**', '.github/workflows/pwa.yml']
  push:
    branches: [main]
    paths: ['pwa/**', '.github/workflows/pwa.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pwa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only
      - run: npm ci
      - run: npm run build
